<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5511E" />
    <meta name="description" content="xushibo.cn — hello world." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="./favicon.ico" sizes="any" />
    <title>xushibo.cn</title>
    <link rel="stylesheet" href="./home.css" />
    <script src="./home.js" defer></script>
  </head>
  <body>
    <main class="terminal" aria-labelledby="prompt-line">
      <div class="titlebar">
        <span class="dot dot-red" aria-hidden="true"></span>
        <span class="dot dot-amber" aria-hidden="true"></span>
        <span class="dot dot-green" aria-hidden="true"></span>
        <span class="title">xushibo.cn — bash</span>
      </div>
      <div class="screen">
        <p class="enter">
          <a class="enter-link" href="https://esa.xushibo.cn/"><span class="enter-prompt">$</span> open esa.xushibo.cn <span class="enter-arrow" aria-hidden="true">↗</span></a>
          <a class="enter-link" href="https://v.xushibo.cn/"><span class="enter-prompt">$</span> open v.xushibo.cn <span class="enter-arrow" aria-hidden="true">↗</span></a>
          <a class="enter-link" href="https://github.com/xushibo"><span class="enter-prompt">$</span> open github <span class="enter-arrow" aria-hidden="true">↗</span></a>
        </p>
        <p id="prompt-line" class="prompt-line">
          <span class="prompt-symbol" aria-hidden="true">#</span>
          <span class="prompt-text" aria-live="polite"></span><span class="cursor" aria-hidden="true"></span>
        </p>
      </div>
    </main>
  </body>
</html>
